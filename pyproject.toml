[project]
name = "jev-dspy-bench"
version = "0.1.0"
description = "Reproducible comparison of Jev and DSPy-optimized general-purpose LLM quality evaluators."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dspy[optuna]==3.3.1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "ty>=0.0.1a20",
]

[project.scripts]
jev-dspy = "jev_dspy_bench.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_dspy_bench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]
